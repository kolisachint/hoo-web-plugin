[package]
name = "webtools-fetch"
version = "0.6.0"
edition = "2021"
rust-version = "1.82"
description = "Token-efficient web content fetcher with reference-style URL preservation"
license = "MIT"
repository = "https://github.com/kolisachint/webtools"
homepage = "https://github.com/kolisachint/webtools"
readme = "README.md"
keywords = ["token", "llm", "agent", "fetch", "url"]
categories = ["web-programming", "text-processing"]

[lib]
name = "webfetch"

[features]
default = ["native"]
# Native HTTP (`ReqwestTransport`), the SSRF guard and the OS trust store.
# Without it, callers use `fetch_with` and supply their own `Transport`.
native = ["webfetch-core/native", "dep:tokio"]
# WASI 0.2 `wasi:http` transport from webfetch-core. The host enforces SSRF
# policy, timeouts and TLS; `fetch_with` is the entry point.
wasi = ["webfetch-core/wasi"]

[dependencies]
webfetch-core = { workspace = true }
regex = { workspace = true }
tokio = { workspace = true, optional = true }
scraper = { workspace = true }
ego-tree = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
anyhow = { workspace = true }
once_cell = { workspace = true }
